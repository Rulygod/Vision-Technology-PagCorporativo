<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ubicación</title>

    <link rel="stylesheet" href="css/fondo.css">
    <link rel="stylesheet" href="css/ubicacion.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<section class="ubicacion">

    <!-- ===================== -->
    <!-- INFORMACIÓN -->
    <!-- ===================== -->

    <div class="info">

        <h1>
            Aquí <span>estamos</span>
        </h1>

        <!-- Selector de sucursal -->

        <div class="selector-sucursal">

            <button id="anterior" class="flecha">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <h2 id="nombreSucursal"></h2>

            <button id="siguiente" class="flecha">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>

        <!-- Descripción -->

        <p id="descripcion"></p>


        <!-- Dirección -->

        <div class="dato">

            <div class="icono">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div>
                <h3>Ubicación</h3>
                <span id="direccion"></span>
            </div>

        </div>


        <!-- Teléfono -->

        <div class="dato">

            <div class="icono">
                <i class="fa-solid fa-phone"></i>
            </div>

            <div>
                <h3>WhatsApp / Teléfono</h3>
                <span id="telefono"></span>
            </div>

        </div>


        <!-- Correo -->

        <div class="dato">

            <div class="icono">
                <i class="fa-regular fa-envelope"></i>
            </div>

            <div>
                <h3>Correo electrónico</h3>
                <span id="correo"></span>
            </div>

        </div>


        <!-- Horario -->

        <div class="dato">

            <div class="icono">
                <i class="fa-regular fa-clock"></i>
            </div>

            <div>
                <h3>Horario de atención</h3>
                <span id="horario"></span>
            </div>

        </div>


        <!-- Botón -->

        <button class="btn-contacto">

            Contactar ahora

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>


    <!-- ===================== -->
    <!-- MAPA -->
    <!-- ===================== -->

    <div class="mapa">

        <iframe
            id="mapa"
            allowfullscreen
            loading="lazy">
        </iframe>

        <!-- Indicadores -->

        <div id="indicadores" class="indicadores"></div>

    </div>

</section>

<!-- ===================== -->
<!-- JAVASCRIPT -->
<!-- ===================== -->

<script src="js/ubicacion/sucursales.js"></script>
<script src="js/ubicacion/ubicacion.js"></script>

</body>
</html>
