<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios Estratégicos - Vision Technology</title>
    <!-- Tus archivos CSS ya existentes -->
    <link rel="stylesheet" href="css/fondo.css">
    <link rel="stylesheet" href="css/socios.css">
</head>
<body>

    <section class="partners-section">
        
        <!-- Título y subtítulo superiores -->
        <div class="partners__header">
            <h1 class="partners__title">Socios estratégicos</h1>
            <p class="partners__subtitle">Trabajamos con proveedores y aliados que respaldan nuestro trabajo</p>
        </div>

        <!-- Reutilizando .hero para mantener las dos columnas perfectamente distribuidas -->
        <div class="socios-hero">
            
            <!-- Columna Izquierda: Proveedores de Calidad y Rejilla -->
            <div class="socios-hero__content">
                <div class="partners__info-box">
                    <div>
                        <h2>Proveedores <span>de Calidad</span></h2>
                        <p class="partners__description">
                            Trabajamos con marcas y proveedores confiables para ofrecer tecnología original, durable y de alto rendimiento, pensada para empresas que buscan seguridad y buen respaldo.
                        </p>
                    </div>

                    <!-- Grilla de los 8 logos pequeños (Solo pon las rutas a tus imágenes) -->
                    <div class="partners__brands-grid">
                        <div class="partners__brand-item"><img src="imgs/socios/Kodak.jpeg" alt="Kodak Alaris"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Targus.jpeg" alt="Targus"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/forza.jpeg" alt="Forza"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/fortinet.jpeg" alt="Fortinet"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/sophos.jpeg" alt="Sophos"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/microsoft.jpeg" alt="Microsoft"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/ricoh.jpeg" alt="Ricoh"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/LG.jpeg" alt="LG"></div>
                        
                        <div class="partners__brand-item"><img src="imgs/socios/Apc.jpeg" alt="Apc"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Cisco.jpeg" alt="Cisco"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Dell.jpeg" alt="Dell"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Epson.jpeg" alt="Epson"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Lenovo.jpeg" alt="Lenovo"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Logitech.jpeg" alt="Logitech"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/Samsung.jpeg" alt="Samsung"></div>
                        <div class="partners__brand-item"><img src="imgs/socios/HP.jpeg" alt="HP"></div>
                        <!-- AÑADIR UN NUEVO SOCIO -->                        
                        <!-- para que que el nuevo socio aparezca en los recuadros pequeños de la pantalla
                        se debe copiar toda la sección <div>, pegarla debajo de la última ingresada y 
                        cambiar la ruta de la imagen junto con la descripción de la misma
                        
                        Ejemplo: 
                        <div class="partners__brand-item"><img src="imgs/socios/nokia.jpeg" alt="nokia"></div>

                        -->
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Imagen gigante destacada -->
            <div class="socios-hero__visual">
                <div class="partners__featured-container">
                    <!--Banner gigante que cambia dinamicamente con cada imagen de cada socio-->
                    <img id="featuredImage" class="partners__featured-img" src="imgs/socios/Kodak.jpeg" alt="Proveedor Destacado">
                </div>
            </div>

        </div>

    </section>



    <!--
    --COMO AÑADIR UN NUEVO SOCIO--

    Para poder alimentar o ingresar nuevos socios, ingresar una nueva imagen en imgs/socios/... 
    
    -->
    <script>
        const imagenes = [
            "imgs/socios/Kodak.jpeg",
            "imgs/socios/Targus.jpeg",
            "imgs/socios/forza.jpeg",
            "imgs/socios/fortinet.jpeg",
            "imgs/socios/sophos.jpeg",
            "imgs/socios/microsoft.jpeg",
            "imgs/socios/ricoh.jpeg",
            "imgs/socios/lg.jpeg",
            
            "imgs/socios/Apc.jpeg",
            "imgs/socios/Cisco.jpeg",
            "imgs/socios/Dell.jpeg",
            "imgs/socios/Epson.jpeg",
            "imgs/socios/Lenovo.jpeg",
            "imgs/socios/Logitech.jpeg",
            "imgs/socios/Samsung.jpeg",
            "imgs/socios/HP.jpeg",

            //Para que la imagen del nuevo socio aparezca en pantalla y cambie dinamicamente, 
            //se debe copiar y pegar la última ruta debajo de la misma y modificar 
            //la tercera sección seguida de la barra "/" por la nueva imagen, al final se debe 
            // colocar una coma " , "
            // Ejemplo -> "imgs/socios/nokia.jpeg",
            
        ];

        let indice = 0;

        const imagenGrande = document.getElementById("featuredImage");

        function cambiarImagen(){

            indice++;

            if(indice >= imagenes.length){
                indice = 0;
            }

            imagenGrande.style.opacity = 0;

            setTimeout(() => {

                imagenGrande.src = imagenes[indice];
                imagenGrande.style.opacity = 1;

            },300);

        }

        setInterval(cambiarImagen,3000);
    </script>
</body>
</html>
